# Optional config file for non-secret settings. Copy to backend/config.toml
# (or point CONFIG_FILE at it). Keys are the lowercase environment variable
# names; an environment variable always wins over this file.
#
# Secrets (DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN, PANDASCORE_TOKEN) are
# rejected here: set them as environment variables only.

# discord_client_id = "000000000000000000"
# discord_guild_id = "000000000000000000"
# database_url = "sqlite://data/dev.db"
# enabled_sources = ["pandascore"]
# log_format = "pretty"       # or "json"
# rust_log = "info"
# bind_addr = "0.0.0.0:8080"
# static_dir = "../frontend/dist"
# image_cache_dir = "data/img-cache"   # image proxy cache (T07)

# Request budget per source, enforced by the sync scheduler (T06).
# Default: 50% of PandaScore's free plan (1,000/h, 60/min).
[budget.pandascore]
per_hour = 500
per_minute = 30

# Sync cadences (T06, docs/adr/0006-sync-scheduler-budget.md). Durations
# like "30s", "5m", "6h", "2d". Env: SYNC__<KEY>, e.g. SYNC__LIVE_EVERY=2m.
# [sync]
# structure_every = "6h"      # followed event structure
# upcoming_window = "48h"
# upcoming_every = "30m"
# imminent_window = "1h"
# imminent_every = "5m"
# overdue_window = "6h"       # keep polling a late start this long
# live_every = "2m"
# corrections_after = ["10m", "2h"]
# search_cache = "24h"
# lock_every = "30s"
# settle_every = "10m"       # settlement sweep (T11)

# Reconciliation (T03, docs/adr/0004-source-adapters-reconciliation.md).
# Only the primary source creates events, teams and matches; other sources
# attach to them or wait in the unlinked queue. Default: the first entry of
# enabled_sources that is not "manual". Env: PRIMARY_SOURCE.
# primary_source = "pandascore"

# Field precedence per field group, highest first. "manual" (admin
# overrides) always comes first. Enabled sources a group does not list
# follow in enabled_sources order. Groups: event, stage, team, teams,
# format, schedule, status, series, map_names, map_rounds, bracket.
# [precedence]
# schedule = ["manual", "pandascore"]
# map_rounds = ["manual", "pandascore"]
