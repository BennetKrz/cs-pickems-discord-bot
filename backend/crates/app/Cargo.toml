[package]
name = "app"
description = "The CS2 Pick'em binary: config, wiring of bot, API and sync worker, graceful shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Dev builds: the `fixture` source, the fake clock endpoints `/api/dev/*`
# and `X-Dev-User` admin auth (T05). `cargo run --features dev`. Production
# images (T16) are built without it.
dev = ["api/dev"]

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
api.workspace = true
axum.workspace = true
backup.workspace = true
bot.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
domain.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
sources = { workspace = true, features = ["pandascore"] }
store.workspace = true
sync.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
