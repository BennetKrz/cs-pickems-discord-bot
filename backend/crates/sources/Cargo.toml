[package]
name = "sources"
description = "Source adapter trait and adapters (PandaScore, manual, fixture)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One feature per adapter module, so a new source is one module plus one
# config entry. `fake` is an in-memory adapter for tests of other crates.
[features]
fake = []
# The dev scenario source (T05). Never enabled in production builds.
fixture = []
# The PandaScore REST adapter (T04).
pandascore = ["dep:reqwest", "dep:tokio", "dep:fastrand", "dep:tracing"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# pandascore
fastrand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Every adapter module is also compiled under `cfg(test)`, so plain
# `cargo test` covers it; the optional dependencies are repeated here.
[dev-dependencies]
axum.workspace = true
fastrand.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
