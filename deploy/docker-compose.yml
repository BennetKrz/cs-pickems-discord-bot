# CS2 Pick'em on a Raspberry Pi (T16). Setup: deploy/README.md.
#
#   cp .env.example .env   # fill it in
#   mkdir -p data
#   docker compose up -d
#
# Reverse proxy, chosen in .env:
#   - bundled Caddy (default): COMPOSE_PROFILES=caddy
#   - an existing Traefik:     COMPOSE_PROFILES= and COMPOSE_FILE with
#                              docker-compose.traefik.yml (network), plus
#                              docker-compose.traefik-labels.yml for labels
#
# `app` publishes no ports. Only the reverse proxy is reachable.
#
# Watchtower (T17) updates `app` when a new image is pushed for IMAGE_TAG.
# It needs `docker login ghcr.io` on the host first (README.md, section 3).

name: cs2-pickem

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}:${IMAGE_TAG:-latest}
    # A stable name on shared networks (the Traefik file-provider snippet
    # points at it).
    container_name: pickem-app
    # The owner of ./data on the host (the Pi user is usually 1000).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    volumes:
      # SQLite database (pickem.db) and the image cache.
      - ./data:/data
    restart: unless-stopped
    # The app shuts down within 8 s; leave room.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      # Watchtower (T17) runs in label-enable mode with a scope: it updates
      # only containers with both labels, i.e. this one.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: cs2-pickem
    # Health: the image's HEALTHCHECK runs `app healthcheck`.

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; keep them across restarts to stay
      # clear of Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

  # Pulls new `app` images and recreates the container (T17). Updates only
  # containers labeled `watchtower.enable=true` *and* `watchtower.scope=
  # cs2-pickem`, so Caddy, an existing Traefik and other stacks are never
  # touched. Itself it carries no enable label: bump its version by hand.
  watchtower:
    image: nickfedor/watchtower:1.24.1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: cs2-pickem
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      # Optional shoutrrr URL, e.g. discord://<token>@<webhook-id>.
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      # Registry credentials: the mounted config.json below.
      DOCKER_CONFIG: /
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The GHCR package is private: the Pi's `docker login ghcr.io`
      # credentials (a read:packages token), read-only. Fails instead of
      # creating a directory if the file doesn't exist yet.
      - type: bind
        source: ${DOCKER_CONFIG_FILE:-${HOME}/.docker/config.json}
        target: /config.json
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      com.centurylinklabs.watchtower.scope: cs2-pickem

volumes:
  caddy_data:
  caddy_config:
