# Traefik (v3) dynamic configuration for the file provider: the same router
# as the labels in docker-compose.traefik-labels.yml, for when you keep the
# route in your own Traefik config. Setup: deploy/README.md, "Option B2".
#
# 1. Copy this file into the directory your file provider watches (e.g.
#    providers.file.directory=/etc/traefik/dynamic), or merge it into your
#    existing dynamic config.
# 2. Replace pickem.example.com, `websecure` and `letsencrypt` with your
#    hostname, your HTTPS entrypoint and your certificate resolver.
# 3. Start the stack with docker-compose.traefik.yml only (not the labels
#    file), so the container `pickem-app` is on Traefik's Docker network.

http:
  routers:
    cs2-pickem:
      rule: Host(`pickem.example.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - cs2-pickem-headers
      service: cs2-pickem

  middlewares:
    # As in the Caddyfile. No X-Frame-Options: Discord shows the Activity in
    # an iframe. No compression: it would alter the API's ETags.
    cs2-pickem-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Server: ""

  services:
    cs2-pickem:
      loadBalancer:
        servers:
          - url: http://pickem-app:8080
